<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="light">
    <button type="button" id="togglebtn">Switch to Dark Mode</button>
    <button id="watchlist">Watchlist</button>
    <h1>Movie Explorer</h1>
    <div class="searchingtools">
        <input type="text" id="searchInput" placeholder="Search movie ....">
        <button id="searchBtn">Search</button>
        <select name="filter" id="filter" >
            <option value="all">All</option>
            <option value="movie">Movies</option>
            <option value="series">series</option>
        </select>
    </div>
    <div id="movie-container">
        
    </div>

    <div id="movie-modal">
        
        <div id="modal-content">

        </div>
       
    </div>
    <div id="watchlist-modal">
        
        <div id="watchlist-content">

        </div>
       
    </div>


    <script src="script.js"></script>

</body>
</html>
